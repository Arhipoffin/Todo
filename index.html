<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Цели</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Цели">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#EEF1EC" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101512" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#EEF1EC; --surface:#FFFFFF; --surface-2:#E3E8E1; --ink:#15201A; --muted:#5E6B63; --line:#D2D9D0;
  --accent:#1F6F4A; --accent-soft:#D5E8DC; --accent-ink:#FFFFFF;
  --miss:#C0563A; --miss-soft:#F4DCD3; --streak:#B4570F; --streak-soft:#FBE9D6; --warn:#B7861A; --future:#F6F8F5;
  --display:"Unbounded",system-ui,sans-serif; --body:"Manrope",system-ui,-apple-system,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#101512; --surface:#18201B; --surface-2:#222C26; --ink:#E6ECE7; --muted:#95A39A; --line:#2D3831;
  --accent:#4FB985; --accent-soft:#1E3B2C; --accent-ink:#0C1A12;
  --miss:#E07B5F; --miss-soft:#3A221B; --streak:#F0A457; --streak-soft:#35261A; --warn:#D9A93E; --future:#141A16;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#101512; --surface:#18201B; --surface-2:#222C26; --ink:#E6ECE7; --muted:#95A39A; --line:#2D3831;
  --accent:#4FB985; --accent-soft:#1E3B2C; --accent-ink:#0C1A12;
  --miss:#E07B5F; --miss-soft:#3A221B; --streak:#F0A457; --streak-soft:#35261A; --warn:#D9A93E; --future:#141A16;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{color-scheme:light;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
body{margin:0;min-height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
button{-webkit-user-select:none;user-select:none;touch-action:manipulation}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45}
.wrap{max-width:720px;margin:0 auto;padding-inline:16px;padding-block:24px 96px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}

header.top{display:flex;align-items:center;gap:12px;margin-bottom:20px}
.back{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:38px;height:38px;display:grid;place-items:center;flex:none}
h1{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:-.01em;margin:0;text-wrap:balance}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* summary */
.summary{background:var(--ink);color:var(--bg);border-radius:18px;padding:20px;display:grid;gap:14px;margin-bottom:24px}
.summary .eyebrow{color:color-mix(in srgb,var(--bg) 65%,transparent)}
.stats{display:flex;gap:28px;flex-wrap:wrap}
.stat b{display:block;font-family:var(--display);font-size:28px;font-weight:500;line-height:1.1}
.stat span{font-size:12px;opacity:.7}
.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;display:flex}
.summary .bar{background:color-mix(in srgb,var(--bg) 18%,transparent)}
.bar i{display:block;height:100%}
.bar .d{background:var(--accent)} .bar .m{background:var(--miss)}
.summary .bar .d{background:var(--accent)}

/* list rows */
.list{display:grid;gap:10px}
.row{display:grid;grid-template-columns:1fr auto;gap:6px 14px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;text-align:left;width:100%}
.row:hover{border-color:var(--accent)}
.row .t{font-weight:700;font-size:16px}
.row .meta{font-size:13px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.row .pct{font-family:var(--display);font-size:20px;font-weight:500;text-align:right}
.row .bar{grid-column:1/-1}
.row .counts{grid-column:1/-1;display:flex;justify-content:space-between;font-size:12px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted)}
.chip.late{background:var(--miss-soft);color:var(--miss)}
.chip.soon{color:var(--warn)}
.chip.ok{background:var(--accent-soft);color:var(--accent)}
.chip.streak{background:var(--streak-soft);color:var(--streak)}
.chip.streak::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.late-t{color:var(--miss)}
.streak-box{display:grid;grid-template-columns:auto auto 1fr;gap:4px 18px;align-items:center;background:var(--streak-soft);border-radius:12px;padding:12px 14px;margin-bottom:16px}
.streak-box b{display:block;font-size:22px;color:var(--streak);line-height:1.1}
.streak-box span{font-size:11px;color:var(--muted)}
.streak-box p{margin:0;font-size:12px;color:var(--muted)}
@media (max-width:420px){.streak-box{grid-template-columns:auto auto}.streak-box p{grid-column:1/-1}}
.day.extra{border-color:var(--miss);border-style:dashed}
.day.extra.done{border-style:solid}
.day.orig-end::before{content:"";position:absolute;right:-5px;top:15%;bottom:15%;width:2px;border-radius:2px;background:var(--miss)}

.section-h{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 10px}
.section-h h2{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:0}
.add{border:1.5px dashed var(--line);background:transparent;border-radius:14px;padding:14px;color:var(--muted);font-weight:600;width:100%}
.add:hover{border-color:var(--accent);color:var(--accent)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:14px;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,16,12,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
@media (min-width:640px){.scrim{align-items:center}}
.sheet{background:var(--surface);width:100%;max-width:460px;border-radius:20px 20px 0 0;padding:20px 16px calc(20px + env(safe-area-inset-bottom,0px));max-height:90%;overflow:auto}
@media (min-width:640px){.sheet{border-radius:20px;padding:22px}}
.sheet h3{font-family:var(--display);font-weight:500;font-size:18px;margin:0 0 4px;text-wrap:balance}
.sheet .sub{color:var(--muted);font-size:13px;margin-bottom:16px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{font-size:11px;color:var(--muted);text-align:center;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.day{aspect-ratio:1;max-width:100%;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--mono);font-size:14px;position:relative;padding:0}
.day small{font-family:var(--body);font-size:9px;color:var(--muted);line-height:1}
.day.done{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.day.done small{color:inherit;opacity:.8}
.day.done::after{content:"✓";position:absolute;top:2px;right:5px;font-size:10px;font-family:var(--body)}
.day.miss{background:var(--miss-soft);border-color:transparent;color:var(--miss)}
.day.future{background:var(--future);border-style:dashed;color:var(--muted);cursor:not-allowed}
.day.today{box-shadow:0 0 0 2px var(--ink)}
.sheet-stats{display:flex;gap:18px;margin:16px 0;font-size:13px;color:var(--muted);flex-wrap:wrap}
.sheet-stats b{color:var(--ink);font-family:var(--mono)}
.actions{display:flex;gap:8px;justify-content:space-between;margin-top:16px;flex-wrap:wrap}
.btn{border-radius:10px;padding:10px 16px;border:1px solid var(--line);background:var(--surface);font-weight:600}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--miss);border-color:transparent;background:transparent;padding-inline:4px}
.field{display:grid;gap:6px;margin-bottom:12px}
.field label{font-size:12px;color:var(--muted);font-weight:600}
.field input,.field textarea{font:inherit;font-size:16px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hint{font-size:12px;color:var(--muted)}
.foot{margin-top:28px;text-align:center}
.link{background:none;border:0;color:var(--muted);font-size:13px;text-decoration:underline;text-underline-offset:3px;padding:8px}
.field textarea{padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%;font-family:var(--mono);font-size:12px;resize:vertical}
.empty{color:var(--muted);text-align:center;padding:24px}
@media (prefers-reduced-motion:no-preference){.sheet.enter{animation:up .18s ease-out}@keyframes up{from{transform:translateY(16px);opacity:.6}}}
</style>

</head>
<body>
<div class="wrap" id="app"></div>
<div id="modal"></div>

<script>
const DAY=864e5;
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
let TODAY=iso(new Date());
const shift=n=>iso(new Date(parse(TODAY).getTime()+n*DAY));
const MON=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
const fmt=s=>{const d=parse(s);return d.getDate()+' '+MON[d.getMonth()]};
const plural=(n,a,b,c)=>{n=Math.abs(n)%100;const k=n%10;return n>10&&n<20?c:k>1&&k<5?b:k==1?a:c};
const dn=n=>n+' '+plural(n,'день','дня','дней');
const uid=()=>Math.random().toString(36).slice(2,9);

function daysOf(t){const out=[];for(let d=parse(t.start);iso(d)<=t.end;d=new Date(d.getTime()+DAY))out.push(iso(d));return out}

let state;
try{state=JSON.parse(localStorage.getItem('celi-v1'))}catch(e){}
if(!state||!state.goals)state={goals:[]};
const save=()=>{try{localStorage.setItem('celi-v1',JSON.stringify(state))}catch(e){}};

let view={goal:null};

/* Перенос дней: каждый пропущенный день добавляет день в конец, так что заложенные N дней всегда нужно отработать.
   t.end — исходный дедлайн, фактический считается здесь. */
function effDays(t){
  const n=daysOf(t).length,out=[];let slots=0;
  for(let d=parse(t.start);slots<n;d=new Date(d.getTime()+DAY)){
    const s=iso(d);out.push(s);
    if(t.done[s]||s>=TODAY)slots++;
  }
  return out;
}
/* Серия: дни подряд с галочкой. Прошедший день без галочки обнуляет, неотмеченное «сегодня» — ещё нет. */
function streaks(days,t){
  let cur=0,best=0;
  for(const d of days){
    if(d>TODAY)break;
    if(t.done[d]){cur++;best=Math.max(best,cur)}
    else if(d<TODAY)cur=0;
  }
  return {cur,best};
}
function taskStats(t){
  const days=effDays(t),total=daysOf(t).length;let done=0,miss=0;
  days.forEach(d=>{if(t.done[d])done++;else if(d<TODAY)miss++});
  return {total,span:days.length,done,miss,left:total-done,end:days[days.length-1],shift:miss,...streaks(days,t)};
}
function goalStats(g){
  return g.tasks.reduce((a,t)=>{const s=taskStats(t);['total','span','done','miss','left'].forEach(k=>a[k]+=s[k]);a.cur=Math.max(a.cur,s.cur);return a},{total:0,span:0,done:0,miss:0,left:0,cur:0});
}
const pct=s=>s.total?Math.round(s.done/s.total*100):0;
const bar=s=>`<div class="bar"><i class="d" style="width:${s.span?s.done/s.span*100:0}%"></i><i class="m" style="width:${s.span?s.miss/s.span*100:0}%"></i></div>`;
const streakChip=s=>s.cur>0?`<span class="chip streak">серия ${dn(s.cur)}</span>`:(s.best>0?`<span class="chip">серия сброшена · рекорд ${s.best}</span>`:'');
function deadlineChip(t){
  const s=taskStats(t);
  if(s.done===s.total)return '<span class="chip ok">выполнено</span>';
  const diff=Math.round((parse(s.end)-parse(TODAY))/DAY);
  if(t.start>TODAY)return `<span class="chip">старт ${fmt(t.start)}</span>`;
  if(diff===0)return '<span class="chip soon">дедлайн сегодня</span>';
  return `<span class="chip ${diff<=3?'soon':''}">до ${fmt(s.end)} · ${dn(diff)}</span>`;
}
const shiftChip=s=>s.shift?`<span class="chip late">дедлайн +${dn(s.shift)}</span>`:'';
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function render(){
  const app=document.getElementById('app');
  if(!view.goal){
    const all=state.goals.reduce((a,g)=>{const s=goalStats(g);['total','span','done','miss','left'].forEach(k=>a[k]+=s[k]);return a},{total:0,span:0,done:0,miss:0,left:0});
    app.innerHTML=`
      <header class="top"><div><div class="eyebrow">${fmt(TODAY)} · сегодня</div><h1>Цели</h1></div></header>
      <section class="summary">
        <div class="eyebrow">Общий прогресс по всем целям</div>
        <div class="stats">
          <div class="stat"><b class="num">${all.done}</b><span>дней пройдено</span></div>
          <div class="stat"><b class="num">${all.left}</b><span>до цели</span></div>
          <div class="stat"><b class="num">+${all.miss}</b><span>дней к дедлайнам</span></div>
          <div class="stat"><b class="num">${pct(all)}%</b><span>из ${dn(all.total)}</span></div>
        </div>
        ${bar(all)}
      </section>
      <div class="section-h"><h2>Мои цели</h2><span class="hint">${state.goals.length}</span></div>
      <div class="list">
        ${state.goals.map(g=>{const s=goalStats(g);return `
          <button class="row" data-goal="${g.id}">
            <div><div class="t">${esc(g.title)}</div><div class="meta"><span>${g.tasks.length} ${plural(g.tasks.length,'задача','задачи','задач')}</span>${s.cur?`<span class="chip streak">лучшая серия ${dn(s.cur)}</span>`:''}</div></div>
            <div class="pct num">${pct(s)}%</div>
            ${bar(s)}
            <div class="counts"><span>пройдено <b class="num">${s.done}</b></span><span>сдвиг <b class="num">+${s.miss}</b></span><span>до цели <b class="num">${s.left}</b></span></div>
          </button>`}).join('')||'<div class="empty">Пока нет целей. Начни с первой — например, «Капитал».</div>'}
        <button class="add" data-act="add-goal">+ Новая цель</button>
      </div>
      ${legend()}
      <div class="foot"><button class="link" data-act="backup">Резервная копия</button></div>`;
  }else{
    const g=state.goals.find(x=>x.id===view.goal);
    if(!g){view.goal=null;return render()}
    const s=goalStats(g);
    app.innerHTML=`
      <header class="top"><button class="back" data-act="back" aria-label="Назад">←</button><div><div class="eyebrow">Цель</div><h1>${esc(g.title)}</h1></div></header>
      <section class="summary">
        <div class="stats">
          <div class="stat"><b class="num">${s.done}</b><span>пройдено</span></div>
          <div class="stat"><b class="num">${s.left}</b><span>до цели</span></div>
          <div class="stat"><b class="num">+${s.miss}</b><span>дней к дедлайнам</span></div>
          <div class="stat"><b class="num">${pct(s)}%</b><span>из ${dn(s.total)}</span></div>
        </div>
        ${bar(s)}
      </section>
      <div class="section-h"><h2>План · подзадачи</h2><span class="hint">нажми, чтобы отметить дни</span></div>
      <div class="list">
        ${g.tasks.map(t=>{const ts=taskStats(t);return `
          <button class="row" data-task="${t.id}">
            <div><div class="t">${esc(t.title)}</div><div class="meta">${deadlineChip(t)}${shiftChip(ts)}${streakChip(ts)}</div></div>
            <div class="pct num">${ts.done}/${ts.total}</div>
            ${bar(ts)}
          </button>`}).join('')||'<div class="empty">Добавь первую подзадачу</div>'}
        <button class="add" data-act="add-task">+ Подзадача</button>
      </div>
      <div class="actions"><span></span><button class="btn danger" data-act="del-goal">${view.confirmDel?'Точно удалить цель?':'Удалить цель'}</button></div>
      ${legend()}`;
  }
}
const legend=()=>`<div class="legend"><span><i style="background:var(--accent)"></i>сделано</span><span><i style="background:var(--miss)"></i>пропущено → +1 день к дедлайну</span><span><i style="background:var(--surface-2);border:1px solid var(--line)"></i>осталось</span><span><i style="border:1px dashed var(--miss)"></i>добавленный день</span></div>`;

/* modal */
const modal=document.getElementById('modal');
function close(){modal.innerHTML='';render()}
function openTask(gid,tid){
  const g=state.goals.find(x=>x.id===gid),t=g.tasks.find(x=>x.id===tid);
  const draw=(confirmDel,first)=>{
    const days=effDays(t),s=taskStats(t);
    const offset=(parse(days[0]).getDay()+6)%7;
    let cells=['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].map(w=>`<div class="wd">${w}</div>`).join('');
    cells+='<div></div>'.repeat(offset);
    days.forEach((d,i)=>{
      const dt=parse(d),cls=(t.done[d]?'done':d>TODAY?'future':d<TODAY?'miss':'')+(d>t.end?' extra':'')+(d===t.end&&s.shift?' orig-end':'');
      const showMon=i===0||dt.getDate()===1;
      cells+=`<button class="day ${cls} ${d===TODAY?'today':''}" data-day="${d}" ${d>TODAY?'aria-disabled="true"':''} aria-pressed="${!!t.done[d]}" title="${fmt(d)}">${dt.getDate()}${showMon?`<small>${MON[dt.getMonth()]}</small>`:''}</button>`;
    });
    modal.innerHTML=`<div class="scrim" data-act="close"><div class="sheet${first?' enter':''}" role="dialog" aria-label="${esc(t.title)}">
      <div class="eyebrow">${esc(g.title)}</div>
      <h3>${esc(t.title)}</h3>
      <div class="sub">${fmt(t.start)} → дедлайн ${s.shift?`<s>${fmt(t.end)}</s> <b class="late-t">${fmt(s.end)}</b> (+${dn(s.shift)} за пропуски)`:fmt(t.end)} · заложено ${dn(s.total)}</div>
      <div class="streak-box"><div><b class="num">${s.cur}</b><span>${plural(s.cur,'день','дня','дней')} подряд</span></div><div><b class="num">${s.best}</b><span>рекорд серии</span></div><p>${s.cur?'Не пропускай — пропуск обнулит серию и добавит день к дедлайну.':s.best?'Серия сброшена. Отметь сегодня, чтобы начать новую.':'Отметь первый день, чтобы начать серию.'}</p></div>
      <div class="cal">${cells}</div>
      <div class="sheet-stats"><span>сделано <b>${s.done}</b></span><span>пропущено <b>${s.miss}</b></span><span>осталось <b>${s.left}</b> из ${s.total}</span><span><b>${pct(s)}%</b></span></div>
      ${bar(s)}
      <div class="actions"><button class="btn danger" data-act="del-task">${confirmDel?'Точно удалить?':'Удалить задачу'}</button><button class="btn primary" data-act="close">Готово</button></div>
    </div></div>`;
    modal.onclick=e=>{
      const day=e.target.closest('[data-day]');
      if(day){const d=day.dataset.day;if(d>TODAY)return;t.done[d]?delete t.done[d]:t.done[d]=1;save();return draw()}
      const a=e.target.closest('[data-act]');if(!a)return;
      if(a.dataset.act==='close'&&(a===e.target||a.classList.contains('btn')))close();
      if(a.dataset.act==='del-task'){if(!confirmDel)return draw(true);g.tasks=g.tasks.filter(x=>x!==t);save();close()}
    };
  };
  draw(false,true);
}
function openForm(kind){
  const isGoal=kind==='goal';
  modal.innerHTML=`<div class="scrim" data-act="close"><form class="sheet enter" id="f">
    <h3>${isGoal?'Новая цель':'Новая подзадача'}</h3>
    <div class="sub">${isGoal?'Например: Капитал, Здоровье, Английский':'Прогресс считается по дням от старта до дедлайна'}</div>
    <div class="field"><label for="f-title">Название</label><input id="f-title" required placeholder="${isGoal?'Капитал':''}"></div>
    ${isGoal?'':`<div class="two"><div class="field"><label for="f-start">Старт</label><input type="date" id="f-start" value="${TODAY}" required></div>
    <div class="field"><label for="f-end">Дедлайн</label><input type="date" id="f-end" value="${shift(13)}" required></div></div>
    <div class="hint" id="f-hint"></div>`}
    <div class="actions"><button type="button" class="btn" data-act="close">Отмена</button><button class="btn primary">Создать</button></div>
  </form></div>`;
  const f=document.getElementById('f');
  const hint=()=>{const h=document.getElementById('f-hint');if(!h)return;const s=f['f-start'].value,e=f['f-end'].value;h.textContent=s&&e&&e>=s?'В календаре будет '+dn(daysOf({start:s,end:e}).length):'Дедлайн должен быть не раньше старта'};
  hint();f.oninput=hint;
  document.getElementById('f-title').focus();
  modal.onclick=e=>{const a=e.target.closest('[data-act="close"]');if(a&&(a===e.target||a.classList.contains('btn')))close()};
  f.onsubmit=e=>{
    e.preventDefault();const title=f['f-title'].value.trim();if(!title)return;
    if(isGoal){state.goals.push({id:uid(),title,tasks:[]})}
    else{const s=f['f-start'].value,en=f['f-end'].value;if(!s||!en||en<s)return;
      state.goals.find(x=>x.id===view.goal).tasks.push({id:uid(),title,start:s,end:en,done:{}})}
    save();close();
  };
}

function openBackup(){
  modal.innerHTML=`<div class="scrim" data-act="close"><div class="sheet enter">
    <h3>Резервная копия</h3>
    <div class="sub">Данные хранятся только на этом телефоне. Скопируй текст ниже и сохрани в Заметки — если удалишь иконку или сменишь телефон, вставь его сюда и нажми «Восстановить».</div>
    <div class="field"><label for="b-json">Данные</label><textarea id="b-json" rows="6" spellcheck="false"></textarea></div>
    <div class="hint" id="b-msg"></div>
    <div class="actions"><button class="btn" data-act="restore">Восстановить</button><button class="btn primary" data-act="copy">Скопировать</button></div>
  </div></div>`;
  const ta=document.getElementById('b-json'),msg=document.getElementById('b-msg');
  ta.value=JSON.stringify(state);
  let armed=false;
  modal.onclick=e=>{
    const a=e.target.closest('[data-act]');if(!a)return;
    const act=a.dataset.act;
    if(act==='close'&&a===e.target)close();
    if(act==='copy'){
      const fallback=()=>{ta.focus();ta.select();msg.textContent='Текст выделен — нажми «Скопировать» в меню.'};
      try{navigator.clipboard.writeText(ta.value).then(()=>msg.textContent='Скопировано. Вставь в Заметки.',fallback)}catch(err){fallback()}
    }
    if(act==='restore'){
      let data;try{data=JSON.parse(ta.value)}catch(err){}
      if(!data||!Array.isArray(data.goals)){msg.textContent='Не похоже на копию: вставь текст целиком, начиная с {"goals".';return}
      if(!armed){armed=true;a.textContent='Заменить текущие данные?';return}
      state=data;save();view={goal:null};close();
    }
  };
}
document.getElementById('app').onclick=e=>{
  const g=e.target.closest('[data-goal]');if(g){view={goal:g.dataset.goal};render();scrollTo(0,0);return}
  const t=e.target.closest('[data-task]');if(t)return openTask(view.goal,t.dataset.task);
  const a=e.target.closest('[data-act]');if(!a)return;
  const act=a.dataset.act;
  if(act==='back'){view={goal:null};render()}
  if(act==='add-goal')openForm('goal');
  if(act==='backup')openBackup();
  if(act==='add-task')openForm('task');
  if(act==='del-goal'){if(!view.confirmDel){view.confirmDel=true;return render()}state.goals=state.goals.filter(x=>x.id!==view.goal);save();view={goal:null};render()}
};
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){const t=iso(new Date());if(t!==TODAY){TODAY=t;if(!modal.innerHTML)render()}}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal.innerHTML)close()});
render();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
